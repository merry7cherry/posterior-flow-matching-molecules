name: CPU validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install torch-cluster==1.6.3 -f https://data.pyg.org/whl/torch-2.5.1+cpu.html
      - run: python -m pip install '.[test,visualize]'
      - run: python -m pytest -q
      - run: python -m build
      - name: Installed wheel without checkout imports
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "${RUNNER_TEMP}"
          pfm-molecules-example --output-dir molecule-example
          pfm-molecules-train --config "${GITHUB_WORKSPACE}/configs/cpu-smoke.yaml" --data-dir molecule-example --run-dir molecule-run --cpu --stop-after-epoch 1
          pfm-molecules-train --config "${GITHUB_WORKSPACE}/configs/cpu-smoke.yaml" --data-dir molecule-example --run-dir molecule-run --cpu --resume molecule-run/checkpoints/last.ckpt
          pfm-molecules-evaluate --checkpoint molecule-run/checkpoints/final.ckpt --data-dir molecule-example --output-dir molecule-ode --mode ode --device cpu
          pfm-molecules-evaluate --checkpoint molecule-run/checkpoints/final.ckpt --data-dir molecule-example --output-dir molecule-sde --mode sde --device cpu
          pfm-molecules-evaluate --output-dir molecule-sde --metrics-only --workers 1
          pfm-molecules-chirality --source molecule-sde --output molecule-corrected
          pfm-molecules-visualize --run-dir molecule-sde --output molecule-sde/conformer.png
